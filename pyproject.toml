[project]
name = "football-trueskill"
version = "0.1.0"
description = "Compare league placements with classical scoring vs. TrueSkill(tm)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "tabulate>=0.9",
    "trueskill>=0.4.5",
]

[project.scripts]
football-trueskill = "football_trueskill.skill:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.15",
    "ty>=0.0.1a1",
    "types-tabulate",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
